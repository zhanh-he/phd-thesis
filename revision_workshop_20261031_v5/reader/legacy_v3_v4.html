ch component is averaged over its own mask, and the two means have equal relative coefficients. Equal coefficients do not imply equal numerical loss or gradient magnitudes.", "focusText": "Each component is averaged over its own mask, and the two means have equal relative coefficients. Equal coefficients do not imply equal numerical loss or gradient magnitudes.", "oldHtml": "\u003cdel\u003eThis hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.\u003c/del\u003e", "newHtml": "\u003cins\u003eEach component is averaged over its own mask, and the two means have equal relative coefficients. Equal coefficients do not imply equal numerical loss or gradient magnitudes.\u003c/ins\u003e"}, {"id": "B", "label": "B · 保留 SMC 初步比较", "kind": "replacement", "fullText": "All models are trained with the hybrid loss adopted in prior score-informed work~\\cite{kim2024method}. It combines frame-wise binary cross-entropy with onset-wise $\\ell_1$ loss:\n\\begin{equation}\n\\mathcal{L}\n= \\frac{1}{|\\mathcal{J}|}\\sum_{(t,p)\\in\\mathcal{J}} \\ell_{\\mathrm{bce}}\\big(V_{t,p},\\hat{V}_{t,p}\\big)\n+ \\frac{1}{|\\mathcal{I}|}\\sum_{(t,p)\\in\\mathcal{I}} \\left|V_{t,p}-\\hat{V}_{t,p}\\right|.\n\\label{eq:scoreinf:loss}\n\\end{equation}\nHere $\\mathbf{V}$ is the ground-truth velocity target and $\\hat{\\mathbf{V}}$ is the predicted velocity output of either the baseline AMT branch or the score-informed system. The frame-wise BCE and onset-wise L1 terms are averaged over their respective active positions and combined with equal relative coefficients. We retain the hybrid objective of Kim et al. (2024), supported by the preliminary comparison with frame-only and onset-only supervision reported in our associated SMC paper. Equal coefficients do not imply equal numerical loss or gradient magnitudes.", "focusText": "The frame-wise BCE and onset-wise L1 terms are averaged over their respective active positions and combined with equal relative coefficients. We retain the hybrid objective of Kim et al. (2024), supported by the preliminary comparison with frame-only and onset-only supervision reported in our associated SMC paper. Equal coefficients do not imply equal numerical loss or gradient magnitudes.", "oldHtml": "\u003cdel\u003eThis hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.\u003c/del\u003e", "newHtml": "\u003cins\u003eThe frame-wise BCE and onset-wise L1 terms are averaged over their respective active positions and combined with equal relative coefficients. We retain the hybrid objective of Kim et al. (2024), supported by the preliminary comparison with frame-only and onset-only supervision reported in our associated SMC paper. Equal coefficients do not imply equal numerical loss or gradient magnitudes.\u003c/ins\u003e"}, {"id": "C", "label": "C · 解释两项作用", "kind": "replacement", "fullText": "All models are trained with the hybrid loss adopted in prior score-informed work~\\cite{kim2024method}. It combines frame-wise binary cross-entropy with onset-wise $\\ell_1$ loss:\n\\begin{equation}\n\\mathcal{L}\n= \\frac{1}{|\\mathcal{J}|}\\sum_{(t,p)\\in\\mathcal{J}} \\ell_{\\mathrm{bce}}\\big(V_{t,p},\\hat{V}_{t,p}\\big)\n+ \\frac{1}{|\\mathcal{I}|}\\sum_{(t,p)\\in\\mathcal{I}} \\left|V_{t,p}-\\hat{V}_{t,p}\\right|.\n\\label{eq:scoreinf:loss}\n\\end{equation}\nHere $\\mathbf{V}$ is the ground-truth velocity target and $\\hat{\\mathbf{V}}$ is the predicted velocity output of either the baseline AMT branch or the score-informed system. The two terms supervise complementary parts of the note representation: frame-wise BCE covers the active note region, while onset-wise L1 directly penalises the velocity read during post-processing. Each term is averaged over its own active positions, and the two means receive equal relative coefficients. This retains the hybrid formulation used in the prior work and our preliminary verification.", "focusText": "The two terms supervise complementary parts of the note representation: frame-wise BCE covers the active note region, while onset-wise L1 directly penalises the velocity read during post-processing. Each term is averaged over its own active positions, and the two means receive equal relative coefficients. This retains the hybrid formulation used in the prior work and our preliminary verification.", "oldHtml": "\u003cdel\u003eThis hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.\u003c/del\u003e", "newHtml": "\u003cins\u003eThe two terms supervise complementary parts of the note representation: frame-wise BCE covers the active note region, while onset-wise L1 directly penalises the velocity read during post-processing. Each term is averaged over its own active positions, and the two means receive equal relative coefficients. This retains the hybrid formulation used in the prior work and our preliminary verification.\u003c/ins\u003e"}, {"id": "KEEP", "label": "KEEP · 保留原文", "kind": "keep", "fullText": "All models are trained with the hybrid loss adopted in prior score-informed work~\\cite{kim2024method}. It combines frame-wise binary cross-entropy with onset-wise $\\ell_1$ loss:\n\\begin{equation}\n\\mathcal{L}\n= \\frac{1}{|\\mathcal{J}|}\\sum_{(t,p)\\in\\mathcal{J}} \\ell_{\\mathrm{bce}}\\big(V_{t,p},\\hat{V}_{t,p}\\big)\n+ \\frac{1}{|\\mathcal{I}|}\\sum_{(t,p)\\in\\mathcal{I}} \\left|V_{t,p}-\\hat{V}_{t,p}\\right|.\n\\label{eq:scoreinf:loss}\n\\end{equation}\nHere $\\mathbf{V}$ is the ground-truth velocity target and $\\hat{\\mathbf{V}}$ is the predicted velocity output of either the baseline AMT branch or the score-informed system. This hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.", "focusText": "This hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.", "oldHtml": "This hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective.", "newHtml": "This hybrid supervision is useful because it constrains both the local onset value and the broader note sustain region, while still keeping note-level precision central to the objective."}], "recommended": "B", "recommendationLabel": "旧轮编辑推荐", "reviewStatus": "旧轮已复核，待作者选择", "reviewFile": "revision_blueprint_20261031/reviewer_final.md", "candidateFile": "revision_blueprint_20261031/writer_round3.md", "candidateAnchor": "r1-25", "reviewerComment": "Section 4.5.3: Are both loss components balanced? Is there a need to weigh loss components?", "authorResponse": "\u003e This is the following work of a ISMIR2024 paper by Hyon Kim, he found this is the best ratio, and I verfied it. \n\u003e\n\u003e I will directly cite his work to further explain this.", "commentFile": "revision_blueprint_20261031/COMMENT_MAP.md", "contextAfter": "", "followthrough": [], "decisionPath": "revision_blueprint_20261031/DECISIONS.md#decision-r1-25", "sourceSha256": "d3ba02f332041ea4e6e8c89fe342fdf560bd9edda1caafcd4b7c9fb651226eb8"}, {"id": "R1-21", "title": "说明 composition 怎样使用", "short": "原段保留，后面新增应用段。", "group": "用途", "why": "分开说训练标签的来源和实际输入接口，回答 performance MIDI 与 composition 的关系。", "stance": "你明确说试过量化 MIDI，并说 MOS 用量化 score-MIDI；这条原话保留，具体刺激流程待查。", "scope": "只在 Ch3 Discussion 首段后插入所示应用段，不替换 Stimuli；原量化批注不由此改写。", "pending": "V-02：输入和 reference 的 timing preparation、量化步骤仍待生成记录。这里的文字选择不确认听测协议。", "operation": "insertion", "sourceFile": "Chapter_3/chap3.tex", "sourceLine": 453, "originalFull": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "originalFocus": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "options": [{"id": "A", "label": "A · 两句说明", "kind": "insertion", "fullText": "Performance MIDI supplies captured velocity targets for training, while the completion interface can also accept quantised symbolic input. The composition use case is to add a velocity profile while retaining the notes and timing supplied by the user.", "focusText": "Performance MIDI supplies captured velocity targets for training, while the completion interface can also accept quantised symbolic input. The composition use case is to add a velocity profile while retaining the notes and timing supplied by the user.", "summary": "原段后新增两句应用说明。", "oldHtml": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "newHtml": "\u003cins\u003ePerformance MIDI supplies captured velocity targets for training, while the completion interface can also accept quantised symbolic input. The composition use case is to add a velocity profile while retaining the not s an expressive layer to an existing note sequence. Training uses captured velocities from performance MIDI, while deployment can retain the notes and timing of quantised symbolic input. The training target and the timing representation of a new input therefore serve different roles.", "summary": "原段后新增三句应用说明。", "oldHtml": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "newHtml": "\u003cins\u003eFor composition, velocity completion adds an expressive layer to an existing note sequence. Training uses captured velocities from performance MIDI, while deployment can retain the notes and timing of quantised symbolic input. The training target and the timing representation of a new input therefore serve different roles.\u003c/ins\u003e"}, {"id": "KEEP", "label": "KEEP · 保留原文", "kind": "keep", "fullText": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "focusText": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns expressive enhancement into a controllable post-processing stage rather than a full performance-rendering problem, which is exactly the setting encountered in many MIDI-production and corpus-curation workflows.", "oldHtml": "This chapter has verified that note-level dynamics can be recovered usefully even when the symbolic notes and timing are held fixed. It turns ex <script>
'use strict';
const packet=JSON.parse(document.getElementById('packet').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fileLink=p=>'../../'+p.split('/').map((s,i)=>encodeURIComponent(s)).join('/').replace(/%23/g,'#');
const text=(tag,s,cls='')=>`<${tag}${cls?` class="${cls}"`:''}>${esc(s)}</${tag}>`;
let activeId=packet.cards[0]?.id, choices=new Map(), mode='compare', markDiff=true;
let visible=packet.cards;
$('version').textContent=packet.versionNotice;
function link(path,label){return `<a href="${esc(fileLink(path))}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;}
function optionFor(c){return c.options.find(o=>o.id===choices.get(c.id))||c.options.find(o=>o.id===c.recommended);}
function filterCards(){
 const q=$('search').value.trim().toLocaleLowerCase(), f=$('filter').value;
 visible=packet.cards.filter(c=>(f==='all'||f==='pending'&&c.pending||f==='keep'&&c.recommended==='KEEP'||f==='insertion'&&c.operation==='insertion')&&(!q||[c.id,c.title,c.short,c.why,c.originalFull,...c.options.map(o=>o.fullText)].join(' ').toLocaleLowerCase().includes(q)));
 if(!visible.some(c=>c.id===activeId))activeId=visible[0]?.id;
 renderNav();renderCard();
}
function renderNav(){
 $('card-list').innerHTML=visible.map(c=>`<button class="nav-item" type="button" data-card="${esc(c.id)}" ${c.id===activeId?'aria-current="true"':''}><strong>${esc(c.title)}</strong><small>${esc(c.short)}</small></button>`).join('');
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.card,true)));
}
function navigate(id,focus){
 activeId=id;renderNav();renderCard();
 if(focus){$('card-title').focus({preventScroll:true});$('card-title').scrollIntoView({block:'start',behavior:'auto'});}
}
function renderCard(){
 const c=visible.find(x=>x.id===activeId);
 if(!c){$('card').innerHTML='<div class="empty"><h2>没有匹配的改动</h2><p>换一个关键词，或点左侧“重置查看”。</p></div>';$('previous').disabled=true;$('next').disabled=true;return;}
 const o=optionFor(c),insertion=c.operation==='insertion',keep=o.kind==='keep';
 const oldLabel=insertion?'原段 · 保留不动':'原文';
 const newLabel=keep?'KEEP · 与原文相同':insertion?`新增段 · ${o.id}`:`${o.id==='A'&&c.id==='R1-35'?'旧 ':''}候选 ${o.id}`;
 const reduced=(o.originalFocus??c.originalFocus)!==c.originalFull;
 const index=visible.findIndex(x=>x.id===c.id);
 $('card').innerHTML=`
 <div class="meta"><span class="badge">${esc(c.group)}</span><span>${esc(c.id)}</span><span>${esc(c.reviewStatus)}</span></div>
 <h2 id="card-title" tabindex="-1">${esc(c.title)}</h2><p class="lead">${esc(o.summary??c.short)}</p>
 <p class="why"><strong>为什么这样建议</strong>${esc(c.why)}</p>
 <p class="stance"><strong>你原先怎么答</strong>　${esc(c.stance)}</p>
 ${c.pending?`<p class="pending"><strong>文字可选，事实另核</strong>　${esc(c.pending)}</p>`:''}
 <div class="toolbar"><div><label class="caption" for="variant">查看写法 · 不记录选择</label><select id="variant" class="option-select">${c.options.map(v=>`<option value="${esc(v.id)}"${v.id===o.id?' selected':''}>${esc(v.label)}${v.id===c.recommended?' · '+esc(c.recommendationLabel):''}</option>`).join('')}</select></div>
 <div class="display-control"><label for="mode">看法 <select id="mode"><option value="compare"${mode==='compare'?' selected':''}>原文 ↔ 候选</option><option value="proposed"${mode==='proposed'?' selected':''}>只看候选</option><option value="original"${mode==='original'?' selected':''}>只看原文</option></select></label><label class="check"><input type="checkbox" id="mark-diff"${markDiff?' checked':''}>标出增删</label></div></div>
 <p class="keep-row"><span>${c.recommended==='KEEP'?'推荐保留原文。':'保留原文也是一个选项。'}</span><button id="view-keep" class="plain-button" type="button">${keep?'正在查看 KEEP':'查看 KEEP'}</button>${o.id!==c.recommended?'<button id="view-rec" class="plain-button" type="button">回看推荐稿</button>':''}</p>
 ${c.optionNotes?.[o.id]?`<p class="variant-note">${esc(c.optionNotes[o.id])}</p>`:''}
 ${reduced?'<p class="focus-note">先看实际变化的句子；完整段落与保留内容在下方。</p>':''}
 <div id="comparison" class="comparison${markDiff?'':' no-diff'}" data-mode="${mode}">
 <section class="panel old" aria-label="${esc(oldLabel)}"><div class="panel-top"><strong>${esc(oldLabel)}</strong><span>${esc(c.sourceFile)}:${esc(c.sourceLine)}</span></div><p class="text" lang="en" id="old-text">${o.oldHtml}</p></section>
 <section class="panel new" aria-label="${esc(newLabel)}"><div class="panel-top"><strong>${esc(newLabel)}</strong><span>${keep?'不修改':insertion?'插在原段之后':'替换范围见下方'}</span></div><p class="text" lang="en" id="new-text">${o.newHtml}</p></section>
 </div>
 <div class="legend" aria-label="差异标记"><span class="removed">删除</span><span class="added">新增</span>${keep?'<span>无文字差异</span>':''}</div>
 <div class="scope"><strong>具体范围 · ${keep?'保留':insertion?'新增':'替换'}</strong>${esc(keep?(insertion?'保留当前原文，不新增这段；评审意见是否需其他回应仍待作者判断。':c.id==='R1-35'?'保留 Fig6.2 原图与原图注。旧 A 不会因此获准。':'保留当前原文；评审意见是否需其他回应仍待作者判断。'):(o.scope??c.scope))}</div>
 <div class="folds">
 <details id="full-context"><summary>${insertion?'看插入后怎样连读':'看完整段落与同步范围'}</summary><div class="detail-body"><div class="full-pair"><div><h3>${insertion?'当前原段':'准确原块'}</h3><pre lang="en">${esc(c.originalFull)}</pre></div><div><h3>${keep?'KEEP':insertion?'原段＋新增段':`候选 ${o.id} 完整块`}</h3><pre lang="en">${esc(insertion&&!keep?c.originalFull+'\n\n'+o.fullText:o.fullText)}</pre></div></div>
 ${c.contextAfter?`<p><strong>后接原段（未改）</strong></p><blockquote lang="en">${esc(c.contextAfter)}</blockquote>`:''}
 ${!keep&&c.followthrough?.length?`<p><strong>还需同步的 ${c.followthrough.length} 处 · 不另批准第二次</strong></p>${c.followthrough.map(f=>`<div class="follow"><code>${esc(f.file)}:${f.line}</code><p class="text" lang="en"><del>${esc(f.old)}</del></p><p class="text" lang="en"><ins>${esc(f.new)}</ins></p></div>`).join('')}`:''}
 ${insertion?'<p>上方英文按准确字符连读；Stimuli 协议没有包含在这个插入块里。</p>':''}
 </div></details>
 <details id="evidence"><summary>看评审原话、你的回复与来源</summary><div class="detail-body"><p><strong>评审原话</strong></p><blockquote lang="en">${esc(c.reviewerComment)}</blockquote><p><strong>作者原回复（含原拼写）</strong></p><blockquote lang="en">${esc(c.authorResponse)}</blockquote><p>未找到回复不等于作者同意。上方“为什么这样建议”是编辑判断。</p>
 ${c.originalImage?`<p>现有图像（原文件，只读）</p><img class="original-image" src="${esc(fileLink(c.originalImage))}" alt="Fig6.2 原有 SoundFont proxy 架构图">`:''}
 <div class="source-links">${link(c.sourceFile,'原 .tex 文件')}${link(c.commentFile+'#'+c.id.toLowerCase(),'评审／批注记录')}${link(c.candidateFile+'#'+c.candidateAnchor,'准确旧候选')}${link(c.reviewFile,'独立复核')}${c.recommendationSource?link(c.recommendationSource,'KEEP 依据'):''}</div><p>本卡原文已逐字匹配当前源文件；行号是工作坐标，正式送审版本仍待作者确认。</p></div></details>
 </div>
 <div class="footer"><a class="decision-link" href="${esc(fileLink(c.decisionPath))}" target="_blank" rel="noopener">打开原决定清单 · 搜索 ${esc(c.id)} ↗</a><span class="read-only">原 Markdown 用编辑器打开后搜索本卡编号。这里不保存决定；新 v5 稿另审，旧 YES 不转移。</span></div>
 <span id="reading-status" class="sr-only" role="status" aria-live="polite">第 ${index+1} 处，共 ${visible.length} 处。正在查看 ${esc(o.label)}，未记录选择。</span>`;
 $('variant').addEventListener('change',e=>{choices.set(c.id,e.target.value);renderCard();$('variant').focus();});
 $('mode').addEventListener('change',e=>{mode=e.target.value;$('comparison').dataset.mode=mode;});
 $('mark-diff').addEventListener('change',e=>{markDiff=e.target.checked;$('comparison').classList.toggle('no-diff',!markDiff);});
 $('view-keep').addEventListener('click',()=>{choices.set(c.id,'KEEP');renderCard();$('view-keep').focus();});
 if($('view-rec'))$('view-rec').addEventListener('click',()=>{choices.delete(c.id);renderCard();$('variant').focus();});
 $('previous').disabled=index===0;$('next').disabled=index===visible.length-1;
}
$('search').addEventListener('input',filterCards);$('filter').addEventListener('change',filterCards);
$('reset').addEventListener('click',()=>{$('search').value='';$('filter').value='all';choices.clear();mode='compare';markDiff=true;activeId=packet.cards[0]?.id;filterCards();$('search').focus();});
$('previous').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i>0)navigate(visible[i-1].id,true);});
$('next').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i<visible.length-1)navigate(visible[i+1].id,true);});
filterCards();
</script>
</body>
</html>
