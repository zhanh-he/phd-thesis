<script id="packet" type="application/json">/*__PACKET__*/</script>
<script>
'use strict';
const packet=JSON.parse(document.getElementById('packet').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fileLink=p=>'../../'+p.split('/').map((s,i)=>encodeURIComponent(s)).join('/').replace(/%23/g,'#');
const text=(tag,s,cls='')=>`<${tag}${cls?` class="${cls}"`:''}>${esc(s)}</${tag}>`;
let activeId=packet.cards[0]?.id, choices=new Map(), mode='compare', markDiff=true;
let visible=packet.cards, syncMatches=[];
$('version').textContent=packet.versionNotice;
if(packet.mastNote)$('mast-note').textContent=packet.mastNote;
if(packet.packetStatus==='writer-provisional')document.title='待独立评审 · Thesis 文字预览';
if(packet.packetStatus==='jointly-reviewed-v5')document.title='Thesis · v5 最新提案';
if(packet.overviewGroups?.length)$('overview').innerHTML=`<details><summary>${esc(packet.overviewSummary??'更多段落与来源')}</summary><div class="detail-body">${packet.overviewGroups.map(g=>`<p><strong>${esc(g.title)}</strong></p>${g.items.map(i=>`<p>${link(i.path,i.id+' · '+i.label)}</p>`).join('')}`).join('')}<p>${esc(packet.overviewNote??'原 Markdown 打开后搜索编号；以上仍是待独立评审的 writer 方案。')}</p></div></details>`;
if(packet.synchronization?.length)$('synchronization').innerHTML=`<details><summary>同步范围与沿用项</summary><div class="detail-body">${packet.synchronization.map(d=>`<details data-sync-id="${esc(d.displayId)}"><summary>${esc(d.displayId+' · '+d.title)}</summary><p>${esc(d.summary)}</p>${d.old!==undefined?`<p>原文 · ${esc(d.sourceFile)}:${esc(d.sourceLine)}</p><pre>${esc(d.old)}</pre><p>本轮提案</p><pre class="context-v5">${esc(d.new)}</pre>`:''}${d.responseInstruction?`<p>${esc(d.responseInstruction)}</p>`:''}${d.path?`<p>${link(d.path,'准确来源')}</p>`:''}</details>`).join('')}</div></details>`;
if(packet.remainingMaterials?.length)$('remaining-materials').innerHTML=`<details><summary>仍待材料核对</summary><div class="detail-body"><p>${esc(packet.remainingMaterials.join('；'))}。</p><p>文字复核不代替这些记录，也不关闭原有待核项。</p></div></details>`;
function link(path,label){return `<a href="${esc(fileLink(path))}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;}
function optionFor(c){return c.options.find(o=>o.id===choices.get(c.id))||c.options.find(o=>o.id===c.recommended);}
function filterCards(){
 const q=$('search').value.trim().toLocaleLowerCase(), f=$('filter').value;
 syncMatches=q?(packet.synchronization??[]).filter(d=>[d.displayId,d.title,d.summary,d.old,d.new].join(' ').toLocaleLowerCase().includes(q)):[];
 if(syncMatches.length){const outer=document.querySelector('#synchronization>details');if(outer)outer.open=true;document.querySelectorAll('[data-sync-id]').forEach(d=>d.open=syncMatches.some(m=>m.displayId===d.dataset.syncId));}
 visible=packet.cards.filter(c=>(f==='all'||f==='pending'&&c.pending||f==='keep'&&c.recommended==='KEEP'||f==='insertion'&&c.operation==='insertion')&&(!q||[c.id,c.displayId,c.title,c.short,c.navSummary,c.why,c.whyDisplay,c.scopeNote,c.originalFull,...(c.followthrough??[]).map(f=>'v5-'+f.proposalId+' '+f.old+' '+f.new),...(c.independentOptionalDetails??[]).map(d=>'v5-'+d.id+' '+d.old+' '+d.new),...c.options.map(o=>o.fullText)].join(' ').toLocaleLowerCase().includes(q)));
 if(!visible.some(c=>c.id===activeId))activeId=visible[0]?.id;
 renderNav();renderCard();
}
function renderNav(){
 $('mobile-card').innerHTML=visible.map(c=>`<option value="${esc(c.id)}"${c.id===activeId?' selected':''}>${esc(c.title)}</option>`).join('');
 $('card-list').innerHTML=visible.map(c=>`<button class="nav-item" type="button" data-card="${esc(c.id)}" ${c.id===activeId?'aria-current="true"':''}><strong>${esc(c.title)}</strong><small>${esc(c.navSummary??c.short)}</small></button>`).join('');
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.card,true)));
}
function navigate(id,focus){
 activeId=id;renderNav();renderCard();
 if(focus){$('card-title').focus({preventScroll:true});$('card-title').scrollIntoView({block:'start',behavior:'auto'});}
}
function renderCard(){
 const c=visible.find(x=>x.id===activeId);
 if(!c){
 $('card').innerHTML=syncMatches.length?syncMatches.map(d=>`<section><div class="meta">同步项 · 只读对照</div><h2>${esc(d.displayId+' · '+d.title)}</h2><p>${esc(d.summary)}</p>${d.old!==undefined?`<div class="full-pair"><div><h3>准确原文</h3><pre lang="en">${esc(d.old)}</pre></div><div><h3>本轮推荐稿</h3><pre lang="en">${esc(d.new)}</pre></div></div>`:''}<p class="scope">${esc(d.responseInstruction??'此项只作既有范围对照，不新增决定。')}</p></section>`).join(''):'<div class="empty"><h2>没有匹配的改动</h2><p>换一个关键词，或点左侧“重置查看”。</p></div>';
 $('previous').disabled=true;$('next').disabled=true;return;}

 const o=optionFor(c),insertion=c.operation==='insertion',keep=o.kind==='keep';
 const oldLabel=insertion?'原段 · 保留不动':'原文';
 const newLabel=keep?'KEEP · 与原文相同':c.variantDisplayLabels?.[o.id]??(insertion?`新增段 · ${o.id}`:`${o.id==='A'&&c.id==='R1-35'?'旧 ':''}候选 ${o.id}`);
 const reduced=(o.originalFocus??c.originalFocus)!==c.originalFull;
 const index=visible.findIndex(x=>x.id===c.id);
 $('card').innerHTML=`
 <div class="meta"><span class="badge">${esc(c.group)}</span><span>${esc(c.displayId??c.id)}</span><span>${esc(c.reviewStatus)}</span></div>
 <h2 id="card-title" tabindex="-1">${esc(c.title)}</h2>${(o.summary??c.short)!==c.why?`<p class="lead">${esc(o.summary??c.short)}</p>`:''}
 <p class="why"><strong>为什么这样建议</strong>${esc(c.whyDisplay??c.why)}</p>
 ${c.baselineNote?`<p class="focus-note">${esc(c.baselineNote)}</p>`:''}
 <p class="stance"><strong>你原先怎么答</strong>　${esc(c.stance)}</p>
 ${c.pending?`<p class="pending"><strong>文字可选，事实另核</strong>　${esc(c.pending)}</p>`:''}
 <div class="toolbar"><div><label class="caption" for="variant">查看写法 · 不记录选择</label><select id="variant" class="option-select">${c.options.map(v=>`<option value="${esc(v.id)}"${v.id===o.id?' selected':''}>${esc(v.label)}${v.id===c.recommended&&c.showRecommendationLabel!==false?' · '+esc(c.recommendationLabel):''}</option>`).join('')}</select></div>
 <div class="display-control"><label for="mode">看法 <select id="mode"><option value="compare"${mode==='compare'?' selected':''}>原文 ↔ 候选</option><option value="proposed"${mode==='proposed'?' selected':''}>只看候选</option><option value="original"${mode==='original'?' selected':''}>只看原文</option></select></label><label class="check"><input type="checkbox" id="mark-diff"${markDiff?' checked':''}>标出增删</label></div></div>
 <p class="keep-row"><span>${c.recommended==='KEEP'?'推荐保留原文。':'保留原文也是一个选项。'}</span><button id="view-keep" class="plain-button" type="button">${keep?'正在查看 KEEP':'查看 KEEP'}</button>${o.id!==c.recommended?'<button id="view-rec" class="plain-button" type="button">回看推荐稿</button>':''}</p>
 ${c.optionNotes?.[o.id]?`<p class="variant-note">${esc(c.optionNotes[o.id])}</p>`:''}
 ${reduced?`<p class="focus-note">${esc(c.focusNote??'先看实际变化的句子；完整段落与保留内容在下方。')}</p>`:''}
 <div id="comparison" class="comparison${markDiff?'':' no-diff'}" data-mode="${mode}">
 <section class="panel old" aria-label="${esc(oldLabel)}"><div class="panel-top"><strong>${esc(oldLabel)}</strong><span>${esc(c.sourceFile)}:${esc(c.sourceLine)}</span></div><p class="text" lang="en" id="old-text">${o.oldHtml}</p></section>
 <section class="panel new" aria-label="${esc(newLabel)}"><div class="panel-top"><strong>${esc(newLabel)}</strong><span>${keep?'不修改':insertion?'插在原段之后':'替换范围见下方'}</span></div><p class="text" lang="en" id="new-text">${o.newHtml}</p></section>
 </div>
 <div class="legend" aria-label="差异标记"><span class="removed">删除</span><span class="added">新增</span>${keep?'<span>无文字差异</span>':''}</div>
 <div class="scope"><strong>具体范围 · ${keep?'保留':insertion?'新增':'替换'}</strong>${esc(keep?(c.keepScope??(insertion?'保留当前原文，不新增这段；评审意见是否需其他回应仍待作者判断。':c.id==='R1-35'?'保留 Fig6.2 原图与原图注。旧 A 不会因此获准。':'保留当前原文；评审意见是否需其他回应仍待作者判断。')):(o.scope??c.scopeDisplay??c.scope))}${c.scopeNote?`<p>${esc(c.scopeNote)}</p>`:''}</div>
 <div class="folds">
 <details id="full-context"><summary>${insertion?'看插入后怎样连读':'看完整段落与同步范围'}</summary><div class="detail-body"><div class="full-pair"><div><h3>${insertion?'当前原段':'准确原块'}</h3><pre lang="en">${esc(c.originalFull)}</pre></div><div><h3>${keep?'KEEP':insertion?'原段＋新增段':`候选 ${o.id} 完整块`}</h3><pre lang="en">${esc(insertion&&!keep?c.originalFull+'\n\n'+o.fullText:o.fullText)}</pre></div></div>
 ${c.contextAfter?`<p><strong>后接原段（未改）</strong></p><blockquote lang="en">${esc(c.contextAfter)}</blockquote>`:''}
 ${(!keep||c.followthroughIndependent)&&c.followthrough?.length?`<p><strong>${esc(c.followthroughLabel??('还需同步的 '+c.followthrough.length+' 处'))}</strong></p>${c.followthrough.map(f=>`<div class="follow"><code>${f.proposalId?esc('v5-'+f.proposalId)+' · ':''}${esc(f.file)}:${esc(f.line)}</code><p class="text" lang="en"><del>${esc(f.old)}</del></p><p class="text" lang="en"><ins>${esc(f.new)}</ins></p></div>`).join('')}`:''}
 ${insertion?'<p>上方英文按准确字符连读；原段保留，只在指定位置新增候选段。</p>':''}
 </div></details>
 ${c.independentOptionalDetails?.length?`<details id="optional-passages"><summary>同类可选小修 · 每处独立</summary><div class="detail-body"><p>以下不随本卡自动采用；可各自用 v5 编号回复推荐稿／KEEP。</p>${c.independentOptionalDetails.map(d=>`<div class="follow"><strong>${esc('v5-'+d.id)}</strong> · <code>${esc(d.file)}:${esc(d.line)}</code><p>原文</p><pre>${esc(d.old)}</pre><p>推荐稿</p><pre>${esc(d.new)}</pre></div>`).join('')}</div></details>`:''}
 ${c.contextPreview&&o.id===c.recommended?`<details id="assembled-context"><summary>放回相邻语境 · 分清 v5 与 v4</summary><div class="detail-body"><p>${esc(c.contextLegend)}</p><p>本次组合示例包含 ${esc((c.contextIncludedProposalIds??[]).map(id=>'v5-'+id).join('、'))}；${(c.contextCarriedV4Ids??c.contextV4DependencyIds)?.length?'另沿用 '+(c.contextCarriedV4Ids??c.contextV4DependencyIds).length+' 处 v4 提案。':'本段没有原样沿用的 v4 同步项。'}均未实施，本卡 KEEP 不改变其他提案。</p><pre class="context-view" lang="en">${c.contextHtml}</pre>${c.contextDependencyDetails?.length?`<details><summary>查看上下文同步的准确范围</summary><p>这些文字只作为连读依赖。原样沿用的 v4 范围只作对照；本轮修正的范围不继承旧 YES。</p>${c.contextDependencyDetails.map(d=>`<div class="follow"><p><strong>${esc(d.id)}</strong> · ${esc(d.file)}:${esc(d.line)} · ${d.legacyReference?link(d.legacyReference,'旧 '+d.legacyId+' 选择（v4范围）'):esc(d.responseId??'本轮 v5 修正')}</p><p>原文：</p><pre>${esc(d.old)}</pre><p>${d.isCorrected?'本轮 v5 修正（旧 YES 不适用）：':'沿用 v4 提案：'}</p><pre class="${d.isCorrected?'context-v5':'carried-text'}">${d.new?esc(d.new):'〔v4 提案删除此处原文；此标记不是论文文字〕'}</pre></div>`).join('')}</details>`:''}</div></details>`:c.contextPreview?'<p class="focus-note">组合连读固定展示本轮推荐稿；返回推荐稿可查看。当前 KEEP／备选不会改动那份示例。</p>':''}
 <details id="evidence"><summary>${c.evidenceKind==='editorial'?'看编辑发现与来源':'看评审原话、你的回复与来源'}</summary><div class="detail-body"><p><strong>${c.evidenceKind==='editorial'?'编辑发现摘要':'评审原话'}</strong></p><blockquote lang="en">${esc(c.reviewerComment)}</blockquote><p><strong>${c.evidenceKind==='editorial'?'立场记录（不是作者原话）':'作者原回复（含原拼写）'}</strong></p><blockquote lang="en">${esc(c.authorResponse)}</blockquote><p>未找到回复不等于作者同意。上方“为什么这样建议”是编辑判断。</p>
 ${c.originalImage?`<p>现有图像（原文件，只读）</p><img class="original-image" src="${esc(fileLink(c.originalImage))}" alt="Fig6.2 原有 SoundFont proxy 架构图">`:''}
 <div class="source-links">${link(c.sourceFile,'原 .tex 文件')}${link(c.commentFile+'#'+(c.commentSearchId??c.id).toLowerCase(),'评审／批注记录 · 搜索 '+(c.commentSearchId??c.id))}${c.candidateEvidenceByOption?.[o.id]?link(c.candidateEvidenceByOption[o.id].path,c.candidateEvidenceByOption[o.id].label):link(c.candidateFile+'#'+c.candidateAnchor,c.candidateSourceLabel??'准确旧候选')}${link(c.reviewFile,c.reviewLinkLabel??'独立复核')}${c.externalReviewFile?link(c.externalReviewFile,'外部第一轮评阅'):''}${c.recommendationSource?link(c.recommendationSource,'KEEP 依据'):''}${c.writerAgreementFile?link(c.writerAgreementFile,'准确版本与一致记录'):''}</div><p>本卡原文已逐字匹配当前源文件；行号是工作坐标，正式送审版本仍待作者确认。</p>${c.statusNote?`<p>writer 状态原说明：${esc(c.statusNote)}</p>`:''}</div></details>
 </div>
 <div class="footer"><a class="decision-link" href="${esc(fileLink(c.decisionPath))}" target="_blank" rel="noopener">${esc(c.decisionLinkLabel??('打开原决定清单 · 搜索 '+c.id))} ↗</a><span class="read-only">${esc(c.responseInstruction??c.decisionNotice??'原 Markdown 用编辑器打开后搜索本卡编号。这里不保存决定；新 v5 稿另审，旧 YES 不转移。')}</span></div>
 <span id="reading-status" class="sr-only" role="status" aria-live="polite">第 ${index+1} 处，共 ${visible.length} 处。正在查看 ${esc(o.label)}，未记录选择。</span>`;
 $('variant').addEventListener('change',e=>{choices.set(c.id,e.target.value);renderCard();$('variant').focus();});
 $('mode').addEventListener('change',e=>{mode=e.target.value;$('comparison').dataset.mode=mode;});
 $('mark-diff').addEventListener('change',e=>{markDiff=e.target.checked;$('comparison').classList.toggle('no-diff',!markDiff);});
 $('view-keep').addEventListener('click',()=>{choices.set(c.id,'KEEP');renderCard();$('view-keep').focus();});
 if($('view-rec'))$('view-rec').addEventListener('click',()=>{choices.delete(c.id);renderCard();$('variant').focus();});
 $('previous').disabled=index===0;$('next').disabled=index===visible.length-1;
}
$('mobile-card').addEventListener('change',e=>navigate(e.target.value,true));
$('search').addEventListener('input',filterCards);$('filter').addEventListener('change',filterCards);
$('reset').addEventListener('click',()=>{$('search').value='';$('filter').value='all';choices.clear();document.querySelectorAll('#synchronization details,#overview details,#remaining-materials details').forEach(d=>d.open=false);mode='compare';markDiff=true;activeId=packet.cards[0]?.id;filterCards();$('search').focus();});
$('previous').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i>0)navigate(visible[i-1].id,true);});
$('next').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i<visible.length-1)navigate(visible[i+1].id,true);});
filterCards();
</script>
</body>
</html>
