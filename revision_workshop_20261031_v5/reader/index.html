\u003e"}, {"id": "GRID", "label": "备选 · 只解释grid与single-channel", "kind": "replacement", "fullText": "A piano roll gives the U-Net a regular pitch--time grid, with simultaneous notes aligned along the pitch axis. The binary input represents note structure; the single-channel output adds velocity values. Colourisation describes this missing-layer analogy, rather than RGB prediction. This representation supports the convolutional U-Net and window attention used here \\cite{he2025filling,kim2024method}.", "focusText": "A piano roll gives the U-Net a regular pitch--time grid, with simultaneous notes aligned along the pitch axis. The binary input represents note structure; the single-channel output adds velocity values. Colourisation describes this missing-layer analogy, rather than RGB prediction. This representation supports the convolutional U-Net and window attention used here \\cite{he2025filling,kim2024method}.", "summary": "更少讨论note list，但对representation比较的回应较窄。", "oldHtml": "\u003cdel\u003eThis motivates the image-based view adopted in the present chapter. By treating symbolic MIDI as a sparse image and velocity as a colourisation target, the model can exploit local polyphonic structure more directly. U-Net and attention mechanisms are already successful in related music and audio tasks, but the present setting is distinct because it is purely symbolic and does not rely on acoustic input \\cite{he2025filling,kim2024method}. This makes the chapter a natural starting point for the broader thesis.\u003c/del\u003e", "newHtml": "\u003cins\u003eA piano roll gives the U-Net a regular pitch--time grid, with simultaneous notes aligned along the pitch axis. The binary input represents note structure; the single-channel output adds velocity values. Colourisation describes this missing-layer analogy, rather than RGB prediction. This representation supports the convolutional U-Net and window attention used here \\cite{he2025filling,kim2024method}.\u003c/ins\u003e"}, {"id": "KEEP", "label": "KEEP · 保留原文", "kind": "keep", "fullText": "This motivates the image-based view adopted in the present chapter. By treating symbolic MIDI as a sparse image and velocity as a colourisation target, the model can exploit local polyphonic structure more directly. U-Net and attention mechanisms are already successful in related music and audio tasks, but the present setting is distinct because it is purely symbolic and does not rely on acoustic input \\cite{he2025filling,kim2024method}. This makes the chapter a natural starting point for the broader thesis.", "focusText": "This motivates the image-based view adopted in the present chapter. By treating symbolic MIDI as a sparse image and velocity as a colourisation target, the model can exploit local polyphonic structure more directly. U-Net and attention mechanisms are already successful in related music and audio tasks, but the present setting is distinct because it is purely symbolic and does not rely on acoustic input \\cite{he2025filling,kim2024method}. This makes the chapter a natural starting point for the broader thesis.", "oldHtml": "This motivates the image-based view adopted in the present chapter. By treating symbolic MIDI as a sparse image and velocity as a colourisation target, the model can exploit local polyphonic structure more directly. U-Net and attention mechanisms are already successful in related music and audio tasks, but the present setting is distinct because it is purely symbolic and does not rely on acoustic input \\cite{he2025filling,kim2024method}. This makes the chapter a natural starting point for the broader thesis.", "newHtml": "This motivates the image-based view adopted in the present chapter. By treating symbolic MIDI as a sparse image and velocity as a colourisation target, the model can exploit local polyphonic structure more directly. U-Net and attention mechanisms are already successful in related music and audio tasks, but the present setting is distinct because it is purely symbolic and does not rely on acoustic input \\cite{he2025filling,kim2024method}. This makes the chapter a natural starting point for the broader thesis."}], "recommended": "REVIEWED", "recommendationLabel": "本轮推荐", "reviewStatus": "文字已复核 · 供你选择", "decisionPath": "revision_blueprint_20261031/DECISIONS.md", "reviewFile": "revision_workshop_20261031_v5/evaluator_cycle2.md", "candidateFile": "revision_workshop_20261031_v5/FINAL_PASSAGES_REVIEWED_v5.md", "candidateAnchor": "t03", "commentFile": "revision_blueprint_20261031/COMMENT_MAP.md", "reviewerComment": "Section 3.2 and beyond considers the proposed work as “image-based”. Although there are some related figures with varying colours included in this chapter, I do not see any strong argument for using this term – the methodology does not treat dynamics as a colour channel or similar.", "authorResponse": "\u003e Good question. The idea originally came from image-processing papers, especially the use of U-Net and window attention. We use “image-based” because both the input and output are two-dimensional pitch–time matrices, processed with two-dimensional convolutions.\n\u003e\n\u003e The input is a binary piano roll, and the output is a single-channel velocity roll. We do not predict RGB colours. “Colourisation” is an analogy for adding velocity values to the existing note structure, it's good for general audiance understand, but I agree that the wording needs clarification.\n\u003e\n\u003e I would say the “image-like” is more proper. I will make revision.", "optionNotes": {}, "contextPreview": "MIDI velocity completion sits at the intersection of expressive rendering and symbolic refinement. Broad expressive-rendering systems often predict timing, articulation, and dynamics jointly \\cite{jeong2019virtuosonet,borovik2023scoreperformer}. These systems are important, but they are not ideal when the practical goal is to preserve a user's note content and timing while improving only intensity. A velocity-only formulation is narrower, but it is also more controllable.\n\nRecent symbolic velocity-prediction methods have typically treated the task as sequential prediction. Representative examples include convolutional autoencoders and sequence-to-sequence models with attention \\cite{kuo2021velocity,kim2023piano}. These models establish that note-level velocity can be learned from symbolic context. However, piano-roll data is sparse and polyphonic. The relevant structure is not only sequential. It is also spatial. Simultaneous notes create meaningful vertical patterns, and short local pitch--time neighborhoods often carry clear expressive cues.\n\nWe use a piano roll to place simultaneous notes and local pitch--time neighbourhoods on a regular grid for the convolutional U-Net. The input is binary; the single-channel output supplies velocity values, so colourisation is an analogy for adding dynamics to existing notes. A note-list representation would require a different model interface \\cite{he2025filling,kim2024method}.\n\n\\section{Problem Setting}\n\\label{sec:velcomp:problem}\n\nMIDI (Musical Instrument Digital Interface) is the dominant symbolic format in modern music production. A MIDI file that resembles sheet music can still sound mechanical when its note velocities are undefined or flattened to a default constant. In contrast, MIDI captured from human performance preserves the performer's control of intensity and therefore carries a substantial portion of the perceived musical expression. As discussed in the thesis introduction, dynamics is the expressive dimension targeted first in this thesis because it is both perceptually salient and directly editable. This chapter studies the symbolic-only setting in that map: recovering note-level MIDI velocity when the symbolic notes and their timing are already known.\n\n\\begin{figure}[t]\n\\begin{center}\n\\includegraphics[width=0.86\\textwidth]{Chapter_3/figures/p1.png}\n\\caption{Comparison between MIDI notes with human-performed velocity and music-software default velocity (64 when unspecified). The standard deviation of velocity (\\(SD_{\\text{velo}}\\)) represents the dispersion of velocities around their mean across pitches.}\n\\label{fig:velcomp_intro}\n\\end{center}\n\\end{figure}\n\nThis setting is practically important for two reasons. First, a large amount of MIDI used in digital audio workstation workflows is created by step input, quantisation, or low-cost controllers, leaving velocity flat. Second, many expressive rendering systems modify several performance dimensions jointly, including timing and sometimes note content, which is undesirable when the goal is to preserve the user's composition. By isolating velocity, the task becomes a precise and controllable refinement problem: the notes, onsets, and offsets remain fixed, and only note intensity is completed.\n\nThis chapter instead exploits the spatial structure of polyphonic symbolic music by treating MIDI as an image-colourisation problem. MIDI without velocity is represented as a binary pianoroll, while the target is a velocity-valued pianoroll. This formulation is especially natural for instruments such as piano, where multiple simultaneous notes create rich vertical patterns. Current dataset availability restricts the experiments here to piano data, but the formulation itself is not tied to piano alone.\n\n\\section{Representation as Image-like MIDI Matrices}\n\\label{sec:velcomp:representation}\n\n\\subsection{Matrix Representation}\n\\label{sec:velcomp:matrix}\n\nTo process MIDI as images, we convert each performance into three matrices of size \\(T \\times P\\), where \\(T\\) is the number of time frames and \\(P=88\\) is the number of piano pitches.\nThe three matrices are a binary onset roll \\(O\\), marking note starts; a binary frame roll \\(F\\), indicating note activation over time; and a velocity roll \\(V\\), acting as the target colour intensity.\nIn the implemented system, \\(F\\) is the network input, \\(V\\) is the prediction target, and \\(O\\) is used for onset masking in the loss.\nFor the velocity roll, integer values in \\([0,127]\\) are normalised to \\([0,1)\\) to match the model output activation range.\nDuring post-processing, the model output is denormalised by scaling and rounding back to integer MIDI velocity.\nAs illustrated in Figure~\\ref{fig:velcomp_model}, these matrices are highly sparse.", "contextDependencyIdsFinal": ["V4-R1-15-sync-1"], "contextPreviewState": "proposed combination with explicitly named dependencies; no implementation", "writerScope": "只替换Ch3 related-work动机段；其余title、引用、O/F/V和参数保留。", "writerReviewSummary": "R1-17/18：image-based terminology and piano-roll versus note lists.", "writerAuthorResponseSummary": "未找到对本轮新增措辞的既有批准；真实立场见下方说明。", "statusNote": "这些是供作者选择的提案，未写回正文。实验／运行记录核验仍按原材料处理。", "candidateSourceLabel": "准确最终提案", "decisionNotice": "新 v5 范围尚未写入原决定清单。链接仅供查看历史，旧 YES 不批准本页新稿。", "decisionLinkLabel": "查看旧清单 · 搜索 R1-17（历史参考）", "legacyDecisionId": "R1-17", "evidenceKind": "original", "commentSearchId": "R1-17", "candidateEvidenceByOption": {"GRID": {"path": "revision_workshop_20261031_v5/CANDIDATE_PACKET_BLIND_C1.md#t03", "label": "GRID 备选原来源"}}, "reviewLinkLabel": "独立文字复核（指定范围）", "externalReviewFile": "revision_workshop_20261031_v5/evaluator_cycle1.md", "writerWhy": "regular grid保留同时发声和局部pitch–time关系；colourisation是补velocity的类比。", "writerShort": "说明piano roll与二维U-Net的对应关系。", "navSummary": "规则网格呈现同时音与局部邻域，再交代输入和输出。", "whyDisplay": "规则网格呈现同时音与局部邻域，再交代输入和输出。", "displayId": "v5-T03", "responseInstruction": "新稿用 v5-T03（推荐稿／GRID／KEEP）回复我；旧 YES 不转移。", "contextIncludedProposalIds": ["T03"], "contextV4DependencyIds": ["V4-R1-15-sync-1"], "contextLegend": "绿色：本轮 v5 提案；蓝色：沿用 v4 提案；无底色：其余原文。连读示例不是已实施全文。", "contextDependencyDetails": [{"id": "V4-R1-15-sync-1", "file": "Chapter_3/chap3.tex", "line": 31, "old": "This chapter studies the most constrained setting in that map:", "new": "This chapter studies the symbolic-only setting in that map:", "origin": "writer_round3.md R1-15 exact synchronisation", "status": "writer/evaluator agreed for author choice; author-unapproved; not implemented", "legacyId": "R1-15", "legacyReference": "revision_blueprint_20261031/DECISIONS.md#decision-r1-15"}], "contextHtml": "MIDI velocity completion sits at the intersection of expressive rendering and symbolic refinement. Broad expressive-rendering systems often predict timing, articulation, and dynamics jointly \\cite{jeong2019virtuosonet,borovik2023scoreperformer}. These systems are important, but they are not ideal when the practical goal is to preserve a user\u0026#x27;s note content and timing while improving only intensity. A velocity-only formulation is narrower, but it is also more controllable.\n\nRecent symbolic velocity-prediction methods have typically treated the task as sequential prediction. Representative examples include convolutional autoencoders and sequence-to-sequence models with attention \\cite{kuo2021velocity,kim2023piano}. These models establish that note-level velocity can be learned from symbolic context. However, piano-roll data is sparse and polyphonic. The relevant structure is not only sequential. It is also spatial. Simultaneous notes create meaningful vertical patterns, and short local pitch--time neighborhoods often carry clear expressive cues.\n\n\u003cmark class=\"context-v5\" title=\"T03\"\u003eWe use a piano roll to place simultaneous notes and local pitch--time neighbourhoods on a regular grid for the convolutional U-Net. The input is binary; the single-channel output supplies velocity values, so colourisation is an analogy for adding dynamics to existing notes. A note-list representation would require a different model interface \\cite{he2025filling,kim2024method}.\u003c/mark\u003e\n\n\\section{Problem Setting}\n\\label{sec:velcomp:problem}\n\nMIDI (Musical Instrument Digital Interface) is the dominant symbolic format in modern music production. A MIDI file that resembles sheet music can still sound mechanical when its note velocities are undefined or flattened to a default constant. In contrast, MIDI captured from human performance preserves the performer\u0026#x27;s control of intensity and therefore carries a substantial portion of the perceived musical expression. As discussed in the thesis introduction, dynamics is the expressive dimension targeted first in this thesis because it is both perceptually salient and directly editable. \u003cmark class=\"context-v4\" title=\"V4-R1-15-sync-1\"\u003eThis chapter studies the symbolic-only setting in that map:\u003c/mark\u003e recovering note-level MIDI velocity when the symbolic notes and their timing are already known.\n\n\\begin{figure}[t]\n\\begin{center}\n\\includegraphics[width=0.86\\textwidth]{Chapter_3/figures/p1.png}\n\\caption{Comparison between MIDI notes with human-performed velocity and music-software default velocity (64 when unspecified). The standard deviation of velocity (\\(SD_{\\text{velo}}\\)) represents the dispersion of velocities around their mean across pitches.}\n\\label{fig:velcomp_intro}\n\\end{center}\n\\end{figure}\n\nThis setting is practically important for two reasons. First, a large amount of MIDI used in digital audio workstation workflows is created by step input, quantisation, or low-cost controllers, leaving velocity flat. Second, many expressive rendering systems modify several performance dimensions jointly, including timing and sometimes note content, which is undesirable when the goal is to preserve the user\u0026#x27;s composition. By isolating velocity, the task becomes a precise and controllable refinement problem: the notes, onsets, and offsets remain fixed, and only note intensity is completed.\n\nThis chapter instead exploits the spatial structure of polyphonic symbolic music by treating MIDI as an image-colourisation problem. MIDI without velocity is represented as a binary pianoroll, while the target is a velocity-valued pianoroll. This formulation is especially natural for instruments such as piano, where multiple simultaneous notes create rich vertical patterns. Current dataset availability restricts the experiments here to piano data, but the formulation itself is not tied to piano alone.\n\n\\section{Representation as Image-like MIDI Matrices}\n\\label{sec:velcomp:representation}\n\n\\subsection{Matrix Representation}\n\\label{sec:velcomp:matrix}\n\nTo process MIDI as images, we convert each performance into three matrices of size \\(T \\times P\\), where \\(T\\) is the number of time frames and \\(P=88\\) is the number of piano pitches.\nThe three matrices are a binary onset roll \\(O\\), marking note starts; a binary frame roll \\(F\\), indicating note activation over time; and a velocity roll \\(V\\), acting as the target colour intensity.\nIn the implemented system, \\(F\\) is the network input, \\(V\\) is the prediction target, and \\(O\\) is used for onset masking in the loss.\nFor the velocity roll, integer values in \\([0,127]\\) are normalised to \\([0,1)\\) to match the model output activation range.\nDuring post-processing, the model output is denormalised by scaling and rounding back to integer MIDI velocity.\nAs illustrated in Figure~\\ref{fig:velcomp_model}, these matrices are highly sparse.", "showRecommendationLabel": false, "writerAgreementFile": "revision_workshop_20261031_v5/FINAL_WRITER_EVALUATOR_AGREEMENT_v5.md", "writerOptionNotes": {"REVIEWED": "仅供只读比较；此处的浏览选择不构成批准，也不会保存。", "GRID": "仅供只读比较；此处的浏览选择不构成批准，也不会保存。", "KEEP": "仅供只读比较；此处的浏览选择不构成批准，也不会保存。"}, "variantDisplayLabels": {"REVIEWED": "本轮推荐稿"}, "contextCarriedV4Ids": ["V4-R1-15-sync-1"], "contextCorrectedV5Ids": [], "sourceSha256": "d8d6034e98d8b62fd91ee51652663aedb417d565bdbcd220518a95fb0e3c49c9"}, {"id": "T01", "title": "两个术语分开说", "short": "区分力度被简化的数据和缺可靠标签的学习条件。", "group": "场景", "why": "区分力度被简化的数据和缺可靠标签的学习条件。", "stance": "作者真实回复同意补定义；举constant/coarse velocity与missing/unreliable labels。", "scope": "在中心问题之后插入；左侧原问题整段保留，不是替换问题。", " scale quantization.)\"\n\u003e\n\u003e Weak supervise is the missing of groundtruth labels, or low quality groundtruth.", "optionNotes": {}, "contextPreview": "\\section{Unified Thesis Question and Three Core Scenarios}\n\\label{sec:intro:question}\n\nThe thesis is driven by the following question:\n\\begin{quote}\n\\textbf{How can musically interpretable dynamics labels be recovered from incomplete, weakly expressive, or weakly supervised music data without rewriting note content or note timing?}\n\\end{quote}\n\nHere, weakly expressive data retain note content and timing but have simplified dynamics, such as constant or coarsely quantised velocities. Weak supervision refers to learning without reliable direct dynamics labels, using indirect evidence such as the renderer-based supervision in Chapter~\\ref{ch:beyondpiano}. These conditions can overlap.\n\n\nThis question is studied under three core scenarios, outlined in Table~\\ref{tab:intro_scenarios}. These scenarios represent a clear methodological progression. \\textbf{Scenario S1} isolates the recovery task to a strict \\textit{symbolic-only} setting. \\textbf{Scenario S2} introduces acoustic evidence but maintains a reliable structural prior via an \\textit{audio-plus-score} alignment. Finally, \\textbf{Scenario S3} uses an \\textit{audio-only} input to jointly estimate dynamic markings and the metrical coordinates needed for a \\textit{score-facing} output. These settings form the core empirical arc of the thesis by varying both the available evidence and the target representation.\n\n\\begin{table}[h!]\n\\centering\n\\caption{The three core supervision scenarios studied in this thesis. Each scenario specifies the available data, the missing expressive layer, and the target output.}\n\\label{tab:intro_scenarios}\n\\small\n\\setlength{\\tabcolsep}{4pt}\n\\renewcommand{\\arraystretch}{1.15}\n\\begin{tabularx}{\\textwidth}{l X X X}\n\\toprule\n\\textbf{Scenario} \u0026 \\textbf{Available Data} \u0026 \\textbf{Missing Expressive Layer} \u0026 \\textbf{Target Output} \\\\\n\\midrule\nS1 \u0026 MIDI note sequence \u0026 Note-level expressive intensity \u0026 MIDI velocity completion \\\\\nS2 \u0026 Performance audio and aligned MIDI (score) \u0026 Reliable note-level expressive intensity \u0026 Score-informed MIDI velocity refinement \\\\\nS3 \u0026 Performance audio only \u0026 Human-readable score dynamics and metrical coordinates \u0026 Beat-synchronous dynamic levels, beats, and downbeats \\\\\n\\bottomrule\n\\end{tabularx}\n\\end{table}", "contextDependencyIdsFinal": ["V4-scope-1", "V4-R1-15-sync-4"], "contextPreviewState": "proposed combination with explicitly named dependencies; no implementation", "writerScope": "在中心问题之后插入；左侧原问题整段保留，不是替换问题。", "writerReviewSummary": "R1-05：define weakly expressive and weak supervision.", "writerAuthorResponseSummary": "未找到对本轮新增措辞的既有批准；真实立场见下方说明。", "statusNote": "这些是供作者选择的提案，未写回正文。实验／运行记录核验仍按原材料处理。", "candidateSourceLabel": "准确最终提案", "decisionNotice": "新 v5 范围尚未写入原决定清单。链接仅供查看历史，旧 YES 不批准本页新稿。", "decisionLinkLabel": "查看旧清单 · 搜索 R1-05（历史参考）", "legacyDecisionId": "R1-05", "evidenceKind": "original", "commentSearchId": "R1-05", "candidateEvidenceByOption": {}, "navSummary": "区分力度被简化的数据和缺可靠标签的学习条件。", "baselineNote": "这是新增定义，当前 thesis 的中心问题段保持原样。", "reviewLinkLabel": "独立文字复核（指定范围）", "externalReviewFile": "revision_workshop_20261031_v5/evaluator_cycle1.md", "writerWhy": "写清note content and timing，保留两种条件可重叠的含义。", "writerShort": "区分力度被简化的数据与缺少可靠标签的学习条件。", "whyDisplay": "区分力度被简化的数据和缺可靠标签的学习条件。", "displayId": "v5-T01", "responseInstruction": "新稿用 v5-T01（推荐稿／KEEP）回复我；旧 YES 不转移。", "contextIncludedProposalIds": ["T01"], "contextV4DependencyIds": ["V4-scope-1", "V4-R1-15-sync-4"], "contextLegend": "绿色：本轮 v5 提案；蓝色：沿用 v4 提案；无底色：其余原文。连读示例不是已实施全文。", "contextDependencyDetails": [{"id": "V4-scope-1", "file": "Chapter_1/Intro.tex", "line": 118, "old": "Finally, \\textbf{Scenario S3} removes structural support entirely, tackling the fully open, \\textit{audi if(packet.packetStatus==='jointly-reviewed-v5')document.title='Thesis · v5 最新提案';
if(packet.overviewGroups?.length)$('overview').innerHTML=`<details><summary>${esc(packet.overviewSummary??'更多段落与来源')}</summary><div class="detail-body">${packet.overviewGroups.map(g=>`<p><strong>${esc(g.title)}</strong></p>${g.items.map(i=>`<p>${link(i.path,i.id+' · '+i.label)}</p>`).join('')}`).join('')}<p>${esc(packet.overviewNote??'原 Markdown 打开后搜索编号；以上仍是待独立评审的 writer 方案。')}</p></div></details>`;
if(packet.synchronization?.length)$('synchronization').innerHTML=`<details><summary>同步范围与沿用项</summary><div class="detail-body">${packet.synchronization.map(d=>`<details data-sync-id="${esc(d.displayId)}"><summary>${esc(d.displayId+' · '+d.title)}</summary><p>${esc(d.summary)}</p>${d.old!==undefined?`<p>原文 · ${esc(d.sourceFile)}:${esc(d.sourceLine)}</p><pre>${esc(d.old)}</pre><p>本轮提案</p><pre class="context-v5">${esc(d.new)}</pre>`:''}${d.responseInstruction?`<p>${esc(d.responseInstruction)}</p>`:''}${d.path?`<p>${link(d.path,'准确来源')}</p>`:''}</details>`).join('')}</div></details>`;
if(packet.remainingMaterials?.length)$('remaining-materials').innerHTML=`<details><summary>仍待材料核对</summary><div class="detail-body"><p>${esc(packet.remainingMaterials.join('；'))}。</p><p>文字复核不代替这些记录，也不关闭原有待核项。</p></div></details>`;
function link(path,label){return `<a href="${esc(fileLink(path))}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;}
function optionFor(c){return c.options.find(o=>o.id===choices.get(c.id))||c.options.find(o=>o.id===c.recommended);}
function filterCards(){
 const q=$('search').value.trim().toLocaleLowerCase(), f=$('filter').value;
 syncMatches=q?(packet.synchronization??[]).filter(d=>[d.displayId,d.title,d.summary,d.old,d.new].join(' ').toLocaleLowerCase().includes(q)):[];
 if(syncMatches.length){const outer=document.querySelector('#synchronization>details');if(outer)outer.open=true;document.querySelectorAll('[data-sync-id]').forEach(d=>d.open=syncMatches.some(m=>m.displayId===d.dataset.syncId));}
 visible=packet.cards.filter(c=>(f==='all'||f==='pending'&&c.pending||f==='keep'&&c.recommended==='KEEP'||f==='insertion'&&c.operation==='insertion')&&(!q||[c.id,c.displayId,c.title,c.short,c.navSummary,c.why,c.whyDisplay,c.scopeNote,c.originalFull,...(c.followthrough??[]).map(f=>'v5-'+f.proposalId+' '+f.old+' '+f.new),...(c.independentOptionalDetails??[]).map(d=>'v5-'+d.id+' '+d.old+' '+d.new),...c.options.map(o=>o.fullText)].join(' ').toLocaleLowerCase().includes(q)));
 if(!visible.some(c=>c.id===activeId))activeId=visible[0]?.id;
 renderNav();renderCard();
}
function renderNav(){
 $('mobile-card').innerHTML=visible.map(c=>`<option value="${esc(c.id)}"${c.id===activeId?' selected':''}>${esc(c.title)}</option>`).join('');
 $('card-list').innerHTML=visible.map(c=>`<button class="nav-item" type="button" data-card="${esc(c.id)}" ${c.id===activeId?'aria-current="true"':''}><strong>${esc(c.title)}</strong><small>${esc(c.navSummary??c.short)}</small></button>`).join('');
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.card,true)));
}
function navigate(id,focus){
 activeId=id;renderNav();renderCard();
 if(focus){$('card-title').focus({preventScroll:true});$('card-title').scrollIntoView({block:'start',behavior:'auto'});}
}
function renderCard(){
 const c=visible.find(x=>x.id===activeId);
 if(!c){
 $('card').innerHTML=syncMatches.length?syncMatches.map(d=>`<section><div class="meta">同步项 · 只读对照</div><h2>${esc(d.displayId+' · '+d.title)}</h2><p>${esc(d.summary)}</p>${d.old!==undefined?`<div class="full-pair"><div><h3>准确原文</h3><pre lang="en">${esc(d.old)}</pre></div><div><h3>本轮推荐稿</h3><pre lang="en">${esc(d.new)}</pre></div></div>`:''}<p class="scope">${esc(d.responseInstruction??'此项只作既有范围对照，不新增决定。')}</p></section>`).join(''):'<div class="empty"><h2>没有匹配的改动</h2><p>换一个关键词，或点左侧“重置查看”。</p></div>';
 $('previous').disabled=true;$('next').disabled=true;return;}

 const o=optionFor(c),insertion=c.operation==='insertion',keep=o.kind==='keep';
 const oldLabel=insertion?'原段 · 保留不动':'原文';
 const newLabel=keep?'KEEP · 与原文相同':c.variantDisplayLabels?.[o.id]??(insertion?`新增段 · ${o.id}`:`${o.id==='A'&&c.id==='R1-35'?'旧 ':''}候选 ${o.id}`);
 const reduced=(o.originalFocus??c.originalFocus)!==c.originalFull;
 const index=visible.findIndex(x=>x.id===c.id);
 $('card').innerHTML=`
 <div class="meta"><span class="badge">${esc(c.group)}</span><span>${esc(c.displayId??c.id)}</span><span>${esc(c.reviewStatus)}</span></div>
 <h2 id="card-title" tabindex="-1">${esc(c.title)}</h2>${(o.summary??c.short)!==c.why?`<p class="lead">${esc(o.summary??c.short)}</p>`:''}
 <p class="why"><strong>为什么这样建议</strong>${esc(c.whyDisplay??c.why)}</p>
 ${c.baselineNote?`<p class="focus-note">${esc(c.baselineNote)}</p>`:''}
 <p class="stance"><strong>你原先怎么答</strong>　${esc(c.stance)}</p>
 ${c.pending?`<p class="pending"><strong>文字可选，事实另核</strong>　${esc(c.pending)}</p>`:''}
 <div class="toolbar"><div><label class="caption" for="variant">查看写法 · 不记录选择</label><select id="variant" class="option-select">${c.options.map(v=>`<option value="${esc(v.id)}"${v.id===o.id?' selected':''}>${esc(v.label)}${v.id===c.recommended&&c.showRecommendationLabel!==false?' · '+esc(c.recommendationLabel):''}</option>`).join('')}</select></div>
 <div class="display-control"><label for="mode">看法 <select id="mode"><option value="compare"${mode==='compare'?' selected':''}>原文 ↔ 候选</option><option value="proposed"${mode==='proposed'?' selected':''}>只看候选</option><option value="original"${mode==='original'?' selected':''}>只看原文</option></select></label><label class="check"><input type="checkbox" id="mark-diff"${markDiff?' checked':''}>标出增删</label></div></div>
 <p class="keep-row"><span>${c.recommended==='KEEP'?'推荐保留原文。':'保留原文也是一个选项。'}</span><button id="view-keep" class="plain-button" type="button">${keep?'正在查看 KEEP':'查看 KEEP'}</button>${o.id!==c.recommended?'<button id="view-rec" class="plain-button" type="button">回看推荐稿</button>':''}</p>
 ${c.optionNotes?.[o.id]?`<p class="variant-note">${esc(c.optionNotes[o.id])}</p>`:''}
 ${reduced?`<p class="focus-note">${esc(c.focusNote??'先看实际变化的句子；完整段落与保留内容在下方。')}</p>`:''}
 <div id="comparison" class="comparison${markDiff?'':' no-diff'}" data-mode="${mode}">
 <section class="panel old" aria-label="${esc(oldLabel)}"><div class="panel-top"><strong>${esc(oldLabel)}</strong><span>${esc(c.sourceFile)}:${esc(c.sourceLine)}</span></div><p class="text" lang="en" id="old-text">${o.oldHtml}</p></section>
 <section class="panel new" aria-label="${esc(newLabel)}"><div class="panel-top"><strong>${esc(newLabel)}</strong><span>${keep?'不修改':insertion?'插在原段之后':'替换范围见下方'}</span></div><p class="text" lang="en" id="new-text">${o.newHtml}</p></section>
 </div>
 <div class="legend" aria-label="差异标记"><span class="removed">删除</span><span class="added">新增</span>${keep?'<span>无文字差异</span>':''}</div>
 <div class="scope"><strong>具体范围 · ${keep?'保留':insertion?'新增':'替换'}</strong>${esc(keep?(c.keepScope??(insertion?'保留当前原文，不新增这段；评审意见是否需其他回应仍待作者判断。':c.id==='R1-35'?'保留 Fig6.2 原图与原图注。旧 A 不会因此获准。':'保留当前原文；评审意见是否需其他回应仍待作者判断。')):(o.scope??c.scopeDisplay??c.scope))}${c.scopeNote?`<p>${esc(c.scopeNote)}</p>`:''}</div>
 <div class="folds">
 <details id="full-context"><summary>${insertion?'看插入后怎样连读':'看完整段落与同步范围'}</summary><div class="detail-body"><div class="full-pair"><div><h3>${insertion?'当前原段':'准确原块'}</h3><pre lang="en">${esc(c.originalFull)}</pre></div><div><h3>${keep?'KEEP':insertion?'原段＋新增段':`候选 ${o.id} 完整块`}</h3><pre lang="en">${esc(insertion&&!keep?c.originalFull+'\n\n'+o.fullText:o.fullText)}</pre></div></div>
 ${c.contextAfter?`<p><strong>后接原段（未改）</strong></p><blockquote lang="en">${esc(c.contextAfter)}</blockquote>`:''}
 ${(!keep||c.followthroughIndependent)&&c.followthrough?.length?`<p><strong>${esc(c.followthroughLabel??('还需同步的 '+c.followthrough.length+' 处'))}</strong></p>${c.followthrough.map(f=>`<div class="follow"><code>${f.proposalId?esc('v5-'+f.proposalId)+' · ':''}${esc(f.file)}:${esc(f.line)}</code><p class="text" lang="en"><del>${esc(f.old)}</del></p><p class="text" lang="en"><ins>${esc(f.new)}</ins></p></div>`).join('')}`:''}
 ${insertion?'<p>上方英文按准确字符连读；原段保留，只在指定位置新增候选段。</p>':''}
 </div></details>
 ${c.independentOptionalDetails?.length?`<details id="optional-passages"><summary>同类可选小修 · 每处独立</summary><div class="detail-body"><p>以下不随本卡自动采用；可各自用 v5 编号回复推荐稿／KEEP。</p>${c.independentOptionalDetails.map(d=>`<div class="follow"><strong>${esc('v5-'+d.id)}</strong> · <code>${esc(d.file)}:${esc(d.line)}</code><p>原文</p><pre>${esc(d.old)}</pre><p>推荐稿</p><pre>${esc(d.new)}</pre></div>`).join('')}</div></details>`:''}
 ${c.contextPreview&&o.id===c.recommended?`<details id="assembled-context"><summary>放回相邻语境 · 分清 v5 与 v4</summary><div class="detail-body"><p>${esc(c.contextLegend)}</p><p>本次组合示例包含 ${esc((c.contextIncludedProposalIds??[]).map(id=>'v5-'+id).join('、'))}；${(c.contextCarriedV4Ids??c.contextV4DependencyIds)?.length?'另沿用 '+(c.contextCarriedV4Ids??c.contextV4DependencyIds).length+' 处 v4 提案。':'本段没有原样沿用的 v4 同步项。'}均未实施，本卡 KEEP 不改变其他提案。</p><pre class="context-view" lang="en">${c.contextHtml}</pre>${c.contextDependencyDetails?.length?`<details><summary>查看上下文同步的准确范围</summary><p>这些文字只作为连读依赖。原样沿用的 v4 范围只作对照；本轮修正的范围不继承旧 YES。</p>${c.contextDependencyDetails.map(d=>`<div class="follow"><p><strong>${esc(d.id)}</strong> · ${esc(d.file)}:${esc(d.line)} · ${d.legacyReference?link(d.legacyReference,'旧 '+d.legacyId+' 选择（v4范围）'):esc(d.responseId??'本轮 v5 修正')}</p><p>原文：</p><pre>${esc(d.old)}</pre><p>${d.isCorrected?'本轮 v5 修正（旧 YES 不适用）：':'沿用 v4 提案：'}</p><pre class="${d.isCorrected?'context-v5':'carried-text'}">${d.new?esc(d.new):'〔v4 提案删除此处原文；此标记不是论文文字〕'}</pre></div>`).join('')}</details>`:''}</div></details>`:c.contextPreview?'<p class="focus-note">组合连读固定展示本轮推荐稿；返回推荐稿可查看。当前 KEEP／备选不会改动那份示例。</p>':''}
 <details id="evidence"><summary>${c.evidenceKind==='editorial'?'看编辑发现与来源':'看评审原话、你的回复与来源'}</summary><div class="detail-body"><p><strong>${c.evidenceKind==='editorial'?'编辑发现摘要':'评审原话'}</strong></p><blockquote lang="en">${esc(c.reviewerComment)}</blockquote><p><strong>${c.evidenceKind==='editorial'?'立场记录（不是作者原话）':'作者原回复（含原拼写）'}</strong></p><blockquote lang="en">${esc(c.authorResponse)}</blockquote><p>未找到回复不等于作者同意。上方“为什么这样建议”是编辑判断。</p>
 ${c.originalImage?`<p>现有图像（原文件，只读）</p><img class="original-image" src="${esc(fileLink(c.originalImage))}" alt="Fig6.2 原有 SoundFont proxy 架构图">`:''}
 <div class="source-links">${link(c.sourceFile,'原 .tex 文件')}${link(c.commentFile+'#'+(c.commentSearchId??c.id).toLowerCase(),'评审／批注记录 · 搜索 '+(c.commentSearchId??c.id))}${c.candidateEvidenceByOption?.[o.id]?link(c.candidateEvidenceByOption[o.id].path,c.candidateEvidenceByOption[o.id].label):link(c.candidateFile+'#'+c.candidateAnchor,c.candidateSourceLabel??'准确旧候选')}${link(c.reviewFile,c.reviewLinkLabel??'独立复核')}${c.externalReviewFile?link(c.externalReviewFile,'外部第一轮评阅'):''}${c.recommendationSource?link(c.recommendationSource,'KEEP 依据'):''}${c.writerAgreementFile?link(c.writerAgreementFile,'准确版本与一致记录'):''}</div><p>本卡原文已逐字匹配当前源文件；行号是工作坐标，正式送审版本仍待作者确认。</p>${c.statusNote?`<p>writer 状态原说明：${esc(c.statusNote)}</p>`:''}</div></details>
 </div>
 <div class="footer"><a class="decision-link" href="${esc(fileLink(c.decisionPath))}" target="_blank" rel="noopener">${esc(c.decisionLinkLabel??('打开原决定清单 · 搜索 '+c.id))} ↗</a><span class="read-only">${esc(c.responseInstruction??c.decisionNotice??'原 Markdown 用编辑器打开后搜索本卡编号。这里不保存决定；新 v5 稿另审，旧 YES 不转移。')}</span></div>
 <span id="reading-status" class="sr-only" role="status" aria-live="polite">第 ${index+1} 处，共 ${visible.length} 处。正在查看 ${esc(o.label)}，未记录选择。</span>`;
 $('variant').addEventListener('change',e=>{choices.set(c.id,e.target.value);renderCard();$('variant').focus();});
 $('mode').addEventListener('change',e=>{mode=e.target.value;$('comparison').dataset.mode=mode;});
 $('mark-diff').addEventListener('change',e=>{markDiff=e.target.checked;$('comparison').classList.toggle('no-diff',!markDiff);});
 $('view-keep').addEventListener('click',()=>{choices.set(c.id,'KEEP');renderCard();$('view-keep').focus();});
 if($('view-rec'))$('view-rec').addEventListener('click',()=>{choices.delete(c.id);renderCard();$('variant').focus();});
 $('previous').disabled=index===0;$('next').disabled=index===visible.length-1;
}
$('mobile-card').addEventListener('change',e=>navigate(e.target.value,true));
$('search').addEventListener('input',filterCards);$('filter').addEventListener('change',filterCards);
$('reset').addEventListener('click',()=>{$('search').value='';$('filter').value='all';choices.clear();document.querySelectorAll('#synchronization details,#overview details,#remaining-materials details').forEach(d=>d.open=false);mode='compare';markDiff=true;activeId=packet.cards[0]?.id;filterCards();$('search').focus();});
$('previous').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i>0)navigate(visible[i-1].id,true);});
$('next').addEventListener('click',()=>{let i=visible.findIndex(x=>x.id===activeId);if(i<visible.length-1)navigate(visible[i+1].id,true);});
filterCards();
</script>
</body>
</html>
